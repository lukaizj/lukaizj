<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="900" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="55%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <radialGradient id="glowGreen" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(760 55) rotate(135) scale(240 180)">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBlue" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(180 230) rotate(-15) scale(260 150)">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accentLine" x1="48" y1="0" x2="360" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="60%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dotGrid" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#334155" fill-opacity="0.45"/>
    </pattern>
  </defs>

  <!-- Card Base -->
  <rect x="1" y="1" width="898" height="258" rx="16" fill="url(#bg)" stroke="#1E293B" stroke-width="1.5"/>
  <rect x="1" y="1" width="898" height="258" rx="16" fill="url(#dotGrid)"/>
  <rect x="1" y="1" width="898" height="258" rx="16" fill="url(#glowGreen)"/>
  <rect x="1" y="1" width="898" height="258" rx="16" fill="url(#glowBlue)"/>

  <!-- Top Bar -->
  <circle cx="34" cy="30" r="5" fill="#EF4444" fill-opacity="0.85"/>
  <circle cx="52" cy="30" r="5" fill="#F59E0B" fill-opacity="0.85"/>
  <circle cx="70" cy="30" r="5" fill="#10B981" fill-opacity="0.85"/>
  <text x="92" y="34" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12">~/lukaizj/workspace</text>

  <rect x="736" y="18" width="128" height="24" rx="12" fill="#0F172A" stroke="#1E293B"/>
  <circle cx="752" cy="30" r="3.5" fill="#10B981"/>
  <text x="763" y="34" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Segoe UI', sans-serif" font-size="11" font-weight="500">Open to AI Builds</text>

  <!-- Main Title -->
  <text x="48" y="96" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="40" font-weight="700" letter-spacing="-0.5">Lukai</text>
  <rect x="166" y="72" width="96" height="26" rx="13" fill="#10B981" fill-opacity="0.14" stroke="#10B981" stroke-opacity="0.4"/>
  <text x="214" y="89" text-anchor="middle" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="600">奇点造物所</text>

  <!-- Accent Divider -->
  <rect x="48" y="114" width="320" height="2" rx="1" fill="url(#accentLine)"/>

  <!-- Bio / Tagline -->
  <text x="48" y="148" fill="#34D399" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'PingFang SC', sans-serif" font-size="18" font-weight="600">&gt; 试图用 AI 做点什么_</text>
  <text x="48" y="177" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14">Building practical AI workflows, agent skills, and 3D creative apps.</text>

  <!-- Bottom Tags -->
  <rect x="48" y="202" width="154" height="28" rx="8" fill="#1E293B" fill-opacity="0.7" stroke="#334155"/>
  <text x="125" y="220" text-anchor="middle" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="12" font-weight="500">Agent Skills &amp; Flows</text>

  <rect x="214" y="202" width="132" height="28" rx="8" fill="#1E293B" fill-opacity="0.7" stroke="#334155"/>
  <text x="280" y="220" text-anchor="middle" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="12" font-weight="500">Vertical AI Apps</text>

  <rect x="358" y="202" width="146" height="28" rx="8" fill="#1E293B" fill-opacity="0.7" stroke="#334155"/>
  <text x="431" y="220" text-anchor="middle" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="12" font-weight="500">Blender &amp; Three.js</text>

  <!-- Right Side Minimal Pipeline Graphic -->
  <g transform="translate(560, 70)">
    <!-- Outer subtle frame -->
    <rect x="0" y="0" width="300" height="154" rx="14" fill="#0F172A" fill-opacity="0.75" stroke="#1E293B" stroke-width="1.2"/>

    <!-- Node 1: Idea -->
    <rect x="20" y="24" width="112" height="42" rx="9" fill="#1E293B" stroke="#334155"/>
    <circle cx="36" cy="45" r="5" fill="#3B82F6"/>
    <text x="48" y="49" fill="#E2E8F0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600">Prompt</text>

    <!-- Arrow 1 -->
    <path d="M138 45 H162" stroke="#475569" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M157 40 L163 45 L157 50" stroke="#475569" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Node 2: Agent -->
    <rect x="168" y="24" width="112" height="42" rx="9" fill="#10B981" fill-opacity="0.14" stroke="#10B981" stroke-opacity="0.55"/>
    <circle cx="184" cy="45" r="5" fill="#10B981"/>
    <text x="196" y="49" fill="#34D399" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600">Agent</text>

    <!-- Connector down -->
    <path d="M224 72 V90" stroke="#10B981" stroke-opacity="0.6" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M219 85 L224 91 L229 85" stroke="#10B981" stroke-opacity="0.6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Node 3: Shipped Output -->
    <rect x="20" y="96" width="260" height="38" rx="9" fill="#0B1120" stroke="#334155"/>
    <circle cx="38" cy="115" r="4.5" fill="#10B981"/>
    <text x="50" y="119" fill="#CBD5E1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5">ship --workflow real-world-tools</text>
  </g>
</svg>
